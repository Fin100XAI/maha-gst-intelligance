# GST Intelligence -- local development stack.
# `make dev` brings this up.  Deployment targets the State Data Centre or
# NIC/MeghRaj inside the State network; nothing here reaches outside it.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: drishti
      POSTGRES_PASSWORD: drishti
      POSTGRES_DB: drishti
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drishti -d drishti"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: drishti
      MINIO_ROOT_PASSWORD: drishti-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DRISHTI_DATABASE_URL: postgresql+psycopg://drishti:drishti@postgres:5432/drishti
      DRISHTI_REDIS_URL: redis://redis:6379/0
      DRISHTI_MINIO_ENDPOINT: minio:9000
      DATABASE_URL: postgresql+psycopg://drishti:drishti@postgres:5432/drishti
    ports: ["8000:8000"]
    volumes: ["./backend:/srv/app"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_started}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE: http://localhost:8000/api/v1
    ports: ["5173:5173"]
    volumes: ["./frontend:/srv/web", "/srv/web/node_modules"]
    depends_on: [api]
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
  miniodata:
